name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Two components in release-please-config.json: npm-package (tags npm-v*) and
  # wp-plugin (tags plugin-v*), each with its own release PR.
  release-please:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-release-please.yml@v1
    with:
      app-id: ${{ vars.RELEASE_BOT_APP_ID }}
    secrets: inherit
