name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  npm-package:
    name: NPM package (lint + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - run: npm ci
        working-directory: npm-package

      - run: npm run lint
        working-directory: npm-package

      - run: npm run build
        working-directory: npm-package

      - run: npm test
        working-directory: npm-package

  wp-plugin:
    name: Plugin assets (lint + build + pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - run: npm ci
        working-directory: wp-plugin

      - run: npm run lint
        working-directory: wp-plugin

      - run: npm run build
        working-directory: wp-plugin

      # public/dist is not in the repository - the release builds it. Assert the
      # build produced the files the plugin enqueues, so a renamed or dropped entry
      # point surfaces here instead of as a 404 in wp-admin.
      - name: Assert the build produced the enqueued assets
        run: |
          for f in gutenberg.js gutenberg.css gutenberg.asset.php admin.js admin.asset.php; do
            test -f "wp-plugin/public/dist/$f" || { echo "::error::wp-plugin/public/dist/$f was not built"; exit 1; }
          done

      # Packs the payload, so a broken bin/pack.sh surfaces here and not in a release.
      - run: npm run pack
        working-directory: wp-plugin

      - name: Assert the payload carries no composer manifest
        run: |
          test -f build/headless/vendor/autoload.php
          test ! -e build/headless/composer.json
          test ! -e build/headless/composer.lock
