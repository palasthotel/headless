name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  npm-package:
    name: NPM package (lint + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - run: npm ci
        working-directory: npm-package

      - run: npm run lint
        working-directory: npm-package

      - run: npm run build
        working-directory: npm-package

      - run: npm test
        working-directory: npm-package

  wp-plugin:
    name: Plugin assets (build + pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - run: npm ci
        working-directory: wp-plugin

      - run: npm run build
        working-directory: wp-plugin

      # Packs the payload, so a broken bin/pack.sh surfaces here and not in a release.
      - run: npm run pack
        working-directory: wp-plugin

      - name: Assert the payload carries no composer manifest
        run: |
          test -f build/headless/vendor/autoload.php
          test ! -e build/headless/composer.json
          test ! -e build/headless/composer.lock
