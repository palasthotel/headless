name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  npm-package:
    name: NPM package (lint + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - run: npm ci
        working-directory: npm-package

      - run: npm run lint
        working-directory: npm-package

      - run: npm run build
        working-directory: npm-package

      - run: npm test
        working-directory: npm-package

  # php -l, build, pack and the payload assertions of the shared workflow. The plugin
  # project is wp-plugin/, its payload wp-plugin/public/.
  wp-plugin:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-pr.yml@v1
    with:
      slug: headless
      root: wp-plugin
      dev-plugin-name: Headless - DEV
      php-versions: '["8.0", "8.2", "8.3", "8.4"]'
      # lint is tsc --noEmit: wp-scripts itself never checks the types
      build-command: npm ci && npm run lint && npm run build
      # public/dist is not in the repository - the build has to produce what the
      # plugin enqueues, so a renamed entry point fails here instead of 404ing in wp-admin
      required-files: |
        dist/gutenberg.js
        dist/gutenberg.css
        dist/gutenberg.asset.php
        dist/admin.js
        dist/admin.asset.php
        vendor/autoload.php
