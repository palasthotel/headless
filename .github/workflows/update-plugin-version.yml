name: Update plugin version

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  contents: read

jobs:
  # Runs on both release PRs. On the npm one the plugin version has not changed and
  # the readme already has its changelog entry, so there is nothing to commit.
  sync-version:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-sync-version.yml@v1
    with:
      app-id: ${{ vars.RELEASE_BOT_APP_ID }}
      root: wp-plugin
    secrets: inherit
