---
name: Build and release to WordPress.org

# The plugin's tags are plugin-v<version>: npm-package/ is released from the same
# repository as npm-v<version>.

on:
  push:
    tags:
      - "plugin-v*"
  # Re-run a failed deploy from a branch that has the fix: a tag ruleset stops tags
  # from being moved, and re-running a tag event replays the workflow file as it was
  # at that tag. It deploys the content of the ref you select, not of the tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version to deploy, without the prefix (e.g. 3.0.4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-svn-deploy.yml@feat/tag-prefix
    with:
      slug: headless
      root: wp-plugin
      tag-prefix: plugin-v
      version: ${{ github.event.inputs.version }}
      build-command: npm ci && npm run build
      php-version: "8.2"
      dry-run: true
      tools-ref: feat/tag-prefix
    secrets: inherit
